<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Meeting Details</title>

  ```
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#f4f7fb;
      font-family:Arial, sans-serif;
    }

    .container-box{
      max-width:1000px;
      margin:40px auto;
      background:white;
      border-radius:15px;
      padding:30px;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    .section{
      margin-bottom:25px;
    }

    .section h4{
      color:#0d6efd;
      margin-bottom:10px;
    }

    pre{
      white-space:pre-wrap;
      word-wrap:break-word;
      font-family:Arial, sans-serif;
      font-size:15px;
    }
  </style>
  ```

</head>

<body>

<div class="container-box">

  ```
  <h2 class="text-center mb-4">Meeting Details</h2>

  <div class="section">
    <h4>Meeting Title</h4>
    <p th:text="${meeting.title}"></p>
  </div>

  <div class="section">
    <h4>Date & Time</h4>
    <p th:text="${meeting.dateTime}"></p>
  </div>

  <div class="section">
    <h4>Participants</h4>
    <p th:text="${meeting.participants}"></p>
  </div>

  <div class="section">
    <h4>Meeting Transcript</h4>
    <pre th:text="${meeting.transcript}"></pre>
  </div>

  <div class="section">
    <h4>AI Summary</h4>
    <pre th:text="${meeting.summary}"></pre>
  </div>

  <div class="section">
    <h4>Action Items</h4>
    <pre th:text="${meeting.actionItems}"></pre>
  </div>

  <div class="section">
    <h4>Key Points</h4>
    <pre th:text="${meeting.keyPoints}"></pre>
  </div>

  <div class="text-center">
    <a href="/history" class="btn btn-primary">Back to History</a>
  </div>
  ```

</div>

</body>
</html>
