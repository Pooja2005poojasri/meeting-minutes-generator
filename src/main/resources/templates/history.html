<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Meeting History</title>

    ```
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .container-box {
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #0d6efd;
            font-weight: bold;
        }

        table {
            background: white;
        }

        th {
            background: #0d6efd;
            color: white;
            text-align: center;
        }

        td {
            vertical-align: top;
        }

        .summary-cell {
            max-width: 450px;
            white-space: pre-wrap;
        }

        .btn-back {
            margin-top: 25px;
            display: block;
            width: 220px;
            margin-left: auto;
            margin-right: auto;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-size: 18px;
        }

        .action-buttons a {
            margin-bottom: 6px;
        }
    </style>
    ```

</head>

<body>

<div class="container-box">

    ```
    <h2>Meeting History</h2>

    <div class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

            <thead>
            <tr>
                <th>ID</th>
                <th>Date & Time</th>
                <th>Title</th>
                <th>Participants</th>
                <th>AI Summary</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:if="${#lists.isEmpty(meetings)}">
                <td colspan="6" class="empty-message">
                    No meetings found.
                </td>
            </tr>

            <tr th:each="meeting : ${meetings}">

                <td th:text="${meeting.id}"></td>

                <td th:text="${meeting.dateTime}"></td>

                <td th:text="${meeting.title}"></td>

                <td th:text="${meeting.participants}"></td>

                <td class="summary-cell" th:text="${meeting.summary}"></td>

                <td class="text-center action-buttons">

                    <a th:href="@{/history/download/{id}(id=${meeting.id})}"
                       class="btn btn-success btn-sm">
                        Download PDF
                    </a>

                    <br>

                    <a th:href="@{/delete/{id}(id=${meeting.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this meeting?');">
                        Delete
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <a href="/" class="btn btn-primary btn-back">Back to Home</a>
    ```

</div>

</body>

</html>
