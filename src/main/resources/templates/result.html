<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Generated Meeting Minutes</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#f4f7fb;
      font-family:Arial, sans-serif;
    }

    .container-box{
      max-width:1000px;
      margin:40px auto;
      background:white;
      border-radius:15px;
      padding:35px;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    .section-card{
      background:#fafafa;
      border:1px solid #e5e5e5;
      border-radius:12px;
      padding:20px;
      margin-bottom:20px;
    }

    .section-title{
      font-size:20px;
      font-weight:bold;
      color:#0d6efd;
      margin-bottom:15px;
    }

    pre{
      white-space:pre-wrap;
      word-wrap:break-word;
      font-family:Arial, sans-serif;
      font-size:15px;
      line-height:1.7;
      margin:0;
    }

    .btn-group-custom{
      display:flex;
      gap:12px;
      justify-content:center;
      margin-top:30px;
      flex-wrap:wrap;
    }
  </style>

</head>

<body>

<div class="container-box">

  <h2 class="text-center mb-4">Generated Meeting Minutes</h2>

  <div class="section-card">
    <div class="section-title">Meeting Title</div>
    <p th:text="${title}"></p>
  </div>

  <div class="section-card">
    <div class="section-title">Date & Time</div>
    <p th:text="${dateTime}"></p>
  </div>

  <div class="section-card">
    <div class="section-title">Participants</div>
    <p th:text="${participants}"></p>
  </div>

  <div class="section-card">
    <div class="section-title">Meeting Transcript</div>
    <pre th:text="${transcript}"></pre>
  </div>

  <div class="section-card">
    <div class="section-title">AI Summary</div>
    <pre th:text="${summary}"></pre>
  </div>

  <div class="section-card">
    <div class="section-title">Action Items</div>
    <pre th:text="${actionItems}"></pre>
  </div>

  <div class="section-card">
    <div class="section-title">Key Points</div>
    <pre th:text="${keyPoints}"></pre>
  </div>

  <div class="btn-group-custom">
    <a href="/" class="btn btn-primary">Generate New Minutes</a>

    ```
    <a th:href="@{/history/download/{id}(id=${meetingId})}"
       class="btn btn-success">
      Download PDF
    </a>

    <a href="/history" class="btn btn-secondary">View History</a>
    ```

  </div>

</div>

</body>
</html>
